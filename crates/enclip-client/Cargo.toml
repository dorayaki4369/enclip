[package]
name = "enclip-client"
version = "0.1.0"
edition = "2024"

[dependencies]
enclip-core = { version = "0.1.0", path = "../enclip-core" }
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
url = "2.5.9"
