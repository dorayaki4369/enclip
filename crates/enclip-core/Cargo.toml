[package]
name = "enclip-core"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11.1"
base64 = "0.23.1"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
getrandom = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
hpke = { version = "0.15.1", default-features = false, features = ["x25519", "aes", "alloc", "getrandom"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
zeroize = "1.9.2"
